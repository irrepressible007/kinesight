# Render Blueprint for the free plan (512 MB, 0.1 CPU).
# Set META_API_KEY in the service's Environment tab to turn on uploads and live analysis,
# capped by the daily budgets in the Dockerfile. Without a key the site replays the
# recorded preset analyses and never calls the Meta API.
services:
  - type: web
    name: kinesight
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # META_API_KEY is added by hand in the dashboard so it never lives in the repo.
      - key: LIVE_ANALYSIS
        value: "1"
      - key: MAX_VIDEO_SEC
        value: "60"
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: SAM_DECODE_WORKERS
        value: "1"
      - key: FFMPEG_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: UPLOAD_WIDTH
        value: "640"
